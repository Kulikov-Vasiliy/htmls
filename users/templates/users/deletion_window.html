<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Подтвердите действие</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body text-center">
                Вы уверены, что хотите удалить "<strong>{{ object.name }}</strong>"?
            </div>

            <div class="modal-footer d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Нет, пусть остается
                </button>

                {% if user == object and user.is_authenticated %}
                    <button type="submit" form="deleteUserForm" class="btn btn-danger">
                        Да, подтверждаю
                    </button>
                {% endif %}
            </div>

            <!-- Форма, которая отправит запрос на контроллер -->
            {% if user == object and user.is_authenticated %}
                <form id="deleteUserForm" action="{% url 'users:profile_delete' object.pk %}" method="post" style="display: none;">
                    {% csrf_token %}
                </form>

            {% endif %}
       </div>
    </div>
</div>
