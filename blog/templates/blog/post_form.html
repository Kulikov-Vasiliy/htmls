<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Основные поля поста -->
    {{ form.as_p }}

    <!-- Управление медиа-формами (ОБЯЗАТЕЛЬНО) -->
    {{ media_formset.management_form }}

    <div id="media-container">
        {% for media_form in media_formset %}
            <div class="media-form-row">
                {{ media_form.as_p }}
            </div>
        {% endfor %}
    </div>

    <!-- Скрытый шаблон для новых форм -->
    <div id="empty-form-template" style="display:none;">
        <div class="media-form-row">
            {{ media_formset.empty_form.as_p }}
        </div>
    </div>

    <button id="add-media-btn" class="btn btn-secondary">Добавить еще медиа</button>
    <button type="submit" class="btn btn-primary">Опубликовать</button>
</form>
