<!--
Этот блок выполняет роль заглушки для изображения (Placeholder). Вот как это работает по логике Bootstrap:
Имитация картинки: Тег <rect width="100%" height="100%" fill="#777"></rect> просто рисует серый прямоугольник. Это нужно, чтобы показать, где в будущем будет находиться превью-картинка статьи.
Адаптивность: Благодаря параметрам width="100%" и height="96", этот серый блок подстраивается под ширину колонки, сохраняя фиксированную высоту.
Класс bd-placeholder-img: Это внутренний класс примеров Bootstrap. Он сообщает браузеру, что этот SVG нужно трактовать как изображение (например, чтобы к нему применялись стили для картинок).
preserveAspectRatio: Эта настройка заставляет «картинку» вести себя как CSS-свойство object-fit: cover — то есть заполнять всё отведенное пространство без искажений.
-->
<svg aria-hidden="true" class="bd-placeholder-img " height="96"
     preserveAspectRatio="xMidYMid slice" width="100%"
     xmlns="http://www.w3.org/2000/svg">
    <rect width="100%" height="100%" fill="#777"></rect>
</svg>
