{% load custom_tags  %}
<header class="border-bottom lh-1 py-3">
    <div class="row flex-nowrap justify-content-between align-items-center">
        <div class="col-4 pt-1">
            <a class="link-secondary" href="#">Subscribe</a>
        </div>

        <div class="col-4 text-center">
            <a class="blog-header-logo text-body-emphasis text-decoration-none" href="#">Наш блог</a>
        </div>

        <div class="col-4 d-flex justify-content-end align-items-center">
            {% include 'users/svgs/sign_up_in.html' %}
            <a class="link-secondary" href="#" aria-label="Search">
            <svg class="bi" width="20" height="20" fill="currentColor">
                <use xlink:href="#search"></use>
            </svg>
            {% if user.is_authenticated and user == object %}
                <a class="btn btn-sm btn-outline-secondary  ms-2" href="{% url 'blog:main' %}">Выход</a>
                <a class="btn btn-sm btn-outline-danger  ms-2" href="{% url 'blog:main' %}">Удалить</a>
                <a class="btn btn-sm btn-outline-secondary  ms-2" href="{% url 'users:profile_update' object.pk %}">Обновить информацию</a>

            {% else %}
                <a class="btn btn-sm btn-outline-secondary  ms-2" href="{% url 'users:entry' %}">Вход</a>
                <a class="btn btn-sm btn-outline-secondary  ms-2" href="{% url 'users:registration' %}">Регистрация</a>
            {% endif %}

        </div>
    </div>
</header>
