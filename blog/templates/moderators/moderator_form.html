{% extends 'base.html' %}
{% block content %}
    <div class="container">
        <div class="row">
            <div class="col">
                <form class="row" method="post" enctype="multipart/form-data">
                    <div class="card my-card-text my-card-item">
                        <div class="card-body">
                            {% csrf_token %}

                            <h5>Фото профиля</h5>
                            {{ form.as_p }}
                        </div>

                        <div class="d-flex justify-content-between">
                            {% if object %}
                                <button type="submit" class="btn my-btn btn-primary" style="border: 1px solid #0d6efd !important;">Сохранить</button>
                                <a type="reset" href="{% url 'blog:user_detail' pk=object.id %}" class="btn my-btn btn-primary " style="border: 1px solid #0d6efd !important;">Отмена</a>
                            {% else %}
                                <button type="submit" class="btn my-btn btn-primary" style="border: 1px solid #0d6efd !important;">Создать</button>
                                <a type="reset" href="{% url 'blog:home' %}" class="btn my-btn btn-primary " style="border: 1px solid #0d6efd !important;">Отмена</a>
                        {% endif %}
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}
