<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Homework</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    {% if page_name == 'home' %}
        <link href="{% static 'my_styles.css' %}" rel="stylesheet">
    {% elif page_name == 'contacts' %}
        <link href="{% static 'my_con.css' %}" rel="stylesheet">
    {% elif page_name == 'category' %}
        <link href="{% static 'my_cat.css' %}" rel="stylesheet">
    {% elif page_name == 'catalogue' %}
        <link href="{% static 'my_journal.css' %}" rel="stylesheet">
    {% elif page_name == 'product' %}
        <link href="{% static 'my_prod.css' %}" rel="stylesheet">
    {% endif %}
</head>
<body>

    <!-- Боковая панель (Sidebar) -->
    <div class="sidebar">
    {% include 'catalog/includes/navbar.html' %}
    </div>

    <!-- Основной контент -->
    <div class="main-content d-flex flex-column justify-content-center align-items-center" style="margin-left: 5px; min-height: 100vh;">
    {% block content %}
    {% endblock %}
    </div>

    <!-- Подключение Bootstrap JS (для работы выпадающих списков, если они будут использоваться) -->
    <script src="https://cdn.jsdelivr.net/bootstrap.bundle.min.js"></script>
</body>
</html>
