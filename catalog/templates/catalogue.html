{% extends 'base.html' %}
{% load tags %}
{% block content %}
    <figure class="text-center mb-5">
        <h1 class="display-4">Каталог</h1>
    </figure>

    <!-- Список категорий -->
    <div class="row row-cols-1 row-cols-md-2 g-4" style="width: 100%; max-width: 900px;">
        {% for category in catalogue %}
            <div class="col d-flex justify-content-center">
                <div class="card">
                    <img src="{{ category.photo | media_filter }}" class="card-img-top" alt="example">
                    <div class="card-body">
                        <p class="card-text">{{ category.description|default:"Описание отсутствует." }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="my-btn-group d-flex">
                                <a href="{% url 'catalog:category' category.id %}" class="card-link my-btn btn-left">Просмотр</a><a href="#" class="card-link my-btn btn-right">Изменить</a>
                            </div>
                            <small class="text-body-secondary">{{ category.updated_at|timesince }} назад</small>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <p>Категорий пока нет.</p>
        {% endfor %}
    </div>
{% endblock %}
